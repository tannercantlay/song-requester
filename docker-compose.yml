services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: setlist
      POSTGRES_PASSWORD: setlist
      POSTGRES_DB: setlist
    ports:
      - "5432:5432"
    volumes:
      - setlist_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setlist -d setlist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  setlist_db_data:
